<style>
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--gap);padding-bottom:40px;align-items:start}

/* left rail sits on the page itself, with no card behind it */
.rail{grid-column:span 3;padding-top:10px}
.rail h3{margin:0 0 14px;font-size:13.5px;letter-spacing:.6px;text-transform:uppercase;
  color:var(--fg);font-weight:600}
.rail p{margin:0 0 30px;color:var(--dim);font-size:14.2px;line-height:1.7;max-width:34ch}
.orbs{display:flex;gap:12px;flex-wrap:wrap}
.orb{width:56px;height:56px;border-radius:50%;background:#141414;border:1px solid #2e2e2e;
  display:grid;place-items:center;transition:.2s}
/* the tiles are brand-coloured now, so inverting them on a white orb read
   wrong; they lift and glow instead */
.orb{transition:transform .22s cubic-bezier(.2,.7,.3,1),border-color .22s,box-shadow .22s}
.orb:nth-child(1):hover{box-shadow:0 10px 24px rgba(37,211,102,.28)}
.orb:nth-child(2):hover{box-shadow:0 10px 24px rgba(200,50,150,.30)}
.orb:nth-child(3):hover{box-shadow:0 10px 24px rgba(8,102,255,.30)}
.orb img{width:24px;height:24px}
.orb b{font-size:13px;font-weight:600;color:#bdbdbd}

/* the form card */
.formcard{grid-column:span 9;padding:36px 40px 40px}
.formcard h1{margin:0 0 26px;font-size:clamp(26px,3.6vw,38px);font-weight:400;letter-spacing:-.8px}
.formcard h1 .accent{color:var(--accent)}
.f{display:flex;flex-direction:column;gap:14px;position:relative;z-index:10}
.f input,.f textarea{
  width:100%;background:#1a1a1a;border:1px solid #262626;border-radius:12px;
  padding:15px 18px;color:var(--fg);font:inherit;font-size:14.6px;transition:.2s;
}
.f textarea{min-height:126px;resize:vertical}
.f input::placeholder,.f textarea::placeholder{color:#6f6f6f}
.f input:focus,.f textarea:focus{outline:none;border-color:#4a4a4a;background:#1e1e1e}
.f button{
  margin-top:6px;width:100%;padding:16px;border-radius:12px;border:1px solid #333;
  background:#2b2b2b;color:var(--fg);font:inherit;font-size:13.5px;letter-spacing:1.2px;
  text-transform:uppercase;cursor:pointer;transition:.2s;
}
.f button:hover{background:#383838;border-color:#4a4a4a}
.f button:disabled{opacity:.55;cursor:default}
.notice{margin:-10px 0 22px;padding:13px 16px;border-radius:12px;font-size:13.6px;
  background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--dim);
  position:relative;z-index:10}
.notice a{color:var(--accent);text-decoration:underline}
.hint{margin:14px 0 0;font-size:13px;color:var(--faint)}
.hint a{color:var(--accent)}
@media (max-width:900px){ .rail,.formcard{grid-column:span 12} }
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <a class="ghost" href="./">Elyotam Cohen</a>

      <svg viewBox="0 0 24 24"><path d="M6.94 5a2 2 0 1 1-4-.002 2 2 0 0 1 4 .002M7 8.48H3V21h4zm6.32 0H9.34V21h3.92v-6.57c0-3.66 4.77-4 4.77 0V21H22v-7.93c0-6.17-7.06-5.94-8.72-2.91z"/></svg>
      Get in touch
    </a>
  </div>

  <main class="grid">

    <aside class="rail">
      <h3>Get in touch</h3>
      <p>A site, an application, or a process you are still running by hand.
          Messages go straight to my WhatsApp and I answer every one.</p>
      <h3>Elsewhere</h3>
      <div class="orbs">
        <a class="orb" href="https://wa.me/972522057074?text=%D7%94%D7%99%D7%99%2C%20%D7%94%D7%92%D7%A2%D7%AA%D7%99%20%D7%9E%D7%94%D7%90%D7%AA%D7%A8%20%D7%A9%D7%9C%D7%9A%20%D7%95%D7%90%D7%A9%D7%9E%D7%97%20%D7%9C%D7%93%D7%91%D7%A8%20%D7%A2%D7%9C%20%D7%A4%D7%A8%D7%95%D7%99%D7%A7%D7%98%20%F0%9F%91%8B" target="_blank" rel="noopener" aria-label="WhatsApp">
          <img src="assets/icons/whatsapp.svg" alt=""></a>
        <a class="orb" href="https://www.instagram.com/yotamcohenn/" target="_blank" rel="noopener" aria-label="Instagram">
          <img src="assets/icons/instagram.svg" alt=""></a>
        <a class="orb" href="https://www.facebook.com/Elyotamcohen" target="_blank" rel="noopener" aria-label="Facebook">
          <img src="assets/icons/facebook.svg" alt=""></a>
      </div>
    </aside>

    <section class="box formcard reveal" id="form">
      <h1>Start a <span class="accent">conversation.</span></h1>
      <form class="f" id="contactForm" novalidate>
        <input type="text" name="name" placeholder="Name *" required autocomplete="name">
        <input type="email" name="email" placeholder="Email (optional)" autocomplete="email">
        <input type="text" name="subject" placeholder="Subject *" required>
        <textarea name="message" placeholder="What do you need? *" required></textarea>
        <input type="text" name="company" tabindex="-1" autocomplete="off"
               aria-hidden="true" style="position:absolute;left:-9999px;opacity:0">
        <button type="submit">Send</button>
      </form>
      <p class="hint" id="hint"></p>
    </section>

  </main>
