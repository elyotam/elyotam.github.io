<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Elyotam Cohen</title>
<meta name="description" content="Get in touch with Elyotam Cohen about a website, an app or an automation.">
<meta name="theme-color" content="#111111">
<link rel="canonical" href="https://elyotam.github.io/contact.html">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--gap);padding-bottom:40px;align-items:start}

/* left rail sits on the page itself, with no card behind it */
.rail{grid-column:span 3;padding-top:10px}
.rail h3{margin:0 0 14px;font-size:13.5px;letter-spacing:.6px;text-transform:uppercase;
  color:var(--fg);font-weight:600}
.rail p{margin:0 0 30px;color:var(--dim);font-size:14.2px;line-height:1.7;max-width:34ch}
.orbs{display:flex;gap:12px;flex-wrap:wrap}
.orb{width:56px;height:56px;border-radius:50%;background:#141414;border:1px solid #2e2e2e;
  display:grid;place-items:center;transition:.2s}
.orb:hover{background:#fff;border-color:#fff}
.orb:hover img{filter:invert(1)}
.orb:hover b{color:#111}
.orb img{width:24px;height:24px}
.orb b{font-size:13px;font-weight:600;color:#bdbdbd}

/* the form card */
.formcard{grid-column:span 9;padding:36px 40px 40px}
.formcard h1{margin:0 0 26px;font-size:clamp(26px,3.6vw,38px);font-weight:400;letter-spacing:-.8px}
.formcard h1 .accent{color:var(--blue)}
.spark{position:absolute;right:34px;top:22px;width:36px;height:46px;opacity:.85}
.spark svg{width:100%;height:100%;fill:#e9e9e9}
.f{display:flex;flex-direction:column;gap:14px;position:relative;z-index:10}
.f input,.f textarea{
  width:100%;background:#1a1a1a;border:1px solid #262626;border-radius:12px;
  padding:15px 18px;color:var(--fg);font:inherit;font-size:14.6px;transition:.2s;
}
.f textarea{min-height:126px;resize:vertical}
.f input::placeholder,.f textarea::placeholder{color:#6f6f6f}
.f input:focus,.f textarea:focus{outline:none;border-color:#4a4a4a;background:#1e1e1e}
.f button{
  margin-top:6px;width:100%;padding:16px;border-radius:12px;border:1px solid #333;
  background:#2b2b2b;color:var(--fg);font:inherit;font-size:13.5px;letter-spacing:1.2px;
  text-transform:uppercase;cursor:pointer;transition:.2s;
}
.f button:hover{background:#383838;border-color:#4a4a4a}
.f button:disabled{opacity:.55;cursor:default}
.hint{margin:14px 0 0;font-size:13px;color:var(--faint)}
.hint a{color:var(--blue)}
@media (max-width:900px){ .rail,.formcard{grid-column:span 12} }
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <a class="ghost" href="./">HELLO WORLD!</a>
    <button class="burger" id="burger" aria-expanded="false" aria-controls="nav">Menu</button>
    <nav id="nav">
      <a href="./">Home</a><a href="about.html">About</a>
      <a href="projects.html">My Projects</a><a class="on" href="contact.html">Contact</a>
    </nav>
    <a class="pill" href="#form">
      <svg viewBox="0 0 24 24"><path d="M6.94 5a2 2 0 1 1-4-.002 2 2 0 0 1 4 .002M7 8.48H3V21h4zm6.32 0H9.34V21h3.92v-6.57c0-3.66 4.77-4 4.77 0V21H22v-7.93c0-6.17-7.06-5.94-8.72-2.91z"/></svg>
      Let&rsquo;s Connect!
    </a>
  </div>

  <main class="grid">

    <aside class="rail">
      <h3>Say hi &#128075;</h3>
      <p>I read every message. A site, an app, an automation you keep doing by hand,
        or just a hello &mdash; drop a line.</p>
      <h3>Social info</h3>
      <div class="orbs">
        <a class="orb" href="https://github.com/elyotam" rel="noopener" aria-label="GitHub">
          <img src="assets/icons/github.svg" alt=""></a>
        <a class="orb" href="https://elyotam.github.io/code92-website/" rel="noopener"><b>C92</b></a>
        <a class="orb" href="https://elyotam.github.io/elyotam-website/" rel="noopener"><b>EL</b></a>
      </div>
    </aside>

    <section class="box formcard reveal" id="form">
      <div class="spark" aria-hidden="true">
        <svg viewBox="0 0 40 52"><path d="M20 0c.7 14 3 20 12 24-9 4-11.3 10-12 24-.7-14-3-20-12-24 9-4 11.3-10 12-24z"/></svg>
      </div>
      <h1>Let&rsquo;s get in <span class="accent">touch.</span></h1>
      <form class="f" id="contactForm" novalidate>
        <input type="text" name="name" placeholder="Name *" required autocomplete="name">
        <input type="email" name="email" placeholder="Email *" required autocomplete="email">
        <input type="text" name="subject" placeholder="Your Subject *" required>
        <textarea name="message" placeholder="Your Message *" required></textarea>
        <input type="text" name="company" tabindex="-1" autocomplete="off"
               aria-hidden="true" style="position:absolute;left:-9999px;opacity:0">
        <button type="submit">Send message</button>
      </form>
      <p class="hint" id="hint"></p>
    </section>

  </main>
</div>

<footer>
  <nav>
    <a href="./">Home</a><a href="about.html">About</a>
    <a href="projects.html">My Projects</a><a href="contact.html">Contact</a>
  </nav>
  <div><span id="yr">2026</span> &copy; Created with love by
    <a class="by" href="https://github.com/elyotam" rel="noopener">Elyotam Cohen</a></div>
</footer>

<script src="assets/site.js"></script>
<script src="assets/cursor.js"></script>
<script>
/* ---------------------------------------------------------------------------
   Web3Forms delivers the message to your inbox without any server of our own,
   which matters because GitHub Pages only serves static files.

   To switch it on: go to https://web3forms.com, type your email, and they send
   you an access key. Paste it below. No account, no password, free.

   While the key is empty the form does not pretend to work - it says so and
   points at CODE92 instead.
--------------------------------------------------------------------------- */
var ACCESS_KEY   = '';
var FALLBACK_URL = 'https://elyotam.github.io/code92-website/';

var form = document.getElementById('contactForm');
var hint = document.getElementById('hint');
var btn  = form.querySelector('button');

function say(msg, tone) {
  hint.innerHTML = msg;
  hint.style.color = tone === 'ok' ? '#5fce7a' : tone === 'bad' ? '#e8736b' : '';
}

if (!ACCESS_KEY) {
  say('The form is not connected yet &mdash; use ' +
      '<a href="' + FALLBACK_URL + '" rel="noopener">CODE92</a> to reach me.');
} else {
  say('Straight to my inbox. I read every message.');
}

form.addEventListener('submit', function (e) {
  e.preventDefault();

  var f = new FormData(form);
  if ((f.get('company') || '').trim()) return;          // honeypot: a bot filled it

  var name = (f.get('name') || '').trim();
  var mail = (f.get('email') || '').trim();
  var subj = (f.get('subject') || '').trim();
  var body = (f.get('message') || '').trim();

  if (!name || !mail || !subj || !body) {
    say('Please fill in every field before sending.', 'bad');
    return;
  }
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) {
    say('That email address does not look right.', 'bad');
    return;
  }
  if (!ACCESS_KEY) { location.href = FALLBACK_URL; return; }

  btn.disabled = true;
  var label = btn.textContent;
  btn.textContent = 'Sending...';
  say('');

  fetch('https://api.web3forms.com/submit', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
    body: JSON.stringify({
      access_key: ACCESS_KEY,
      name: name, email: mail, subject: subj, message: body,
      from_name: 'elyotam.github.io'
    })
  })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d && d.success) {
        form.reset();
        say('Thanks &mdash; your message is with me. I will reply to ' + mail + '.', 'ok');
      } else {
        say('That did not send. Please try ' +
            '<a href="' + FALLBACK_URL + '" rel="noopener">CODE92</a> instead.', 'bad');
      }
    })
    .catch(function () {
      say('No connection. Please try ' +
          '<a href="' + FALLBACK_URL + '" rel="noopener">CODE92</a> instead.', 'bad');
    })
    .finally(function () { btn.disabled = false; btn.textContent = label; });
});
</script>
</body>
</html>
